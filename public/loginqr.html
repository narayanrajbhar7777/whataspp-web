<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect WhatsApp — Scheduler Pro</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f7fb;
            color: #0f172a;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
            text-align: center;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 22px;
            color: #00843d;
        }

        .sub {
            margin: 0 0 20px;
            font-size: 13px;
            color: #64748b;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            background: #3b82f6;
            color: #fff;
        }

        .status-bar {
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-weight: 800;
            font-size: 13px;
        }

        .connected { background: #dcfce7; color: #166534; }
        .disconnected { background: #fef3c7; color: #92400e; }

        .qr-box {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }

        #qrcode {
            padding: 12px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            display: inline-block;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 16px;
        }

        .active-user {
            font-size: 13px;
            color: #334155;
            margin-bottom: 14px;
        }

        .active-user b { color: #00843d; }

        .link-row {
            margin-top: 16px;
            font-size: 13px;
        }

        .link-row a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
        }

        .hidden { display: none !important; }
    </style>
</head>

<body>
    <div class="card">
        <h1>Connect WhatsApp</h1>
        <p class="sub">Scan the QR with WhatsApp → Linked Devices → Link a Device</p>

        <div id="loginForm">
            <label for="userIdInput">User ID</label>
            <input id="userIdInput" placeholder="U001" autocomplete="off">
            <button onclick="startLogin()">Connect</button>
        </div>

        <div id="activeUserLabel" class="active-user hidden"></div>

        <div id="statusBadge" class="status-bar disconnected hidden">Booting WhatsApp Driver...</div>

        <div class="qr-box">
            <div id="qrcode"></div>
        </div>

        <div id="qrHint" class="hint hidden">Open WhatsApp on your phone, tap Settings → Linked Devices → Link a Device, then scan this code.</div>

        <div id="resetRow" class="link-row hidden">
            <a href="#" onclick="resetLogin(); return false;">Use a different User ID</a>
        </div>

        <div class="link-row">
            <a href="/">← Back to Scheduler Dashboard</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let currentUserId = null;
        let pollInterval = null;

        function getQueryUserId() {
            const params = new URLSearchParams(window.location.search);
            return (params.get('userId') || '').trim();
        }

        function setStatus(text, ok) {
            const el = document.getElementById('statusBadge');
            el.classList.remove('hidden');
            el.textContent = text;
            el.className = 'status-bar ' + (ok ? 'connected' : 'disconnected');
        }

        async function startLogin(presetId) {
            console.log('Starting login process...', presetId);
            const id = (presetId || document.getElementById('userIdInput').value || '').trim();
            if (!id) return alert('Enter a User ID first.');

            currentUserId = id;
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('resetRow').classList.remove('hidden');
            const userLabel = document.getElementById('activeUserLabel');
            userLabel.classList.remove('hidden');
            userLabel.innerHTML = 'Connecting as <b>' + id.replace(/</g, '&lt;') + '</b>';

            setStatus('Booting WhatsApp Driver...', false);

            await fetch(`/api/whatsapp/init/${encodeURIComponent(currentUserId)}`, { method: 'POST' });

            if (pollInterval) clearInterval(pollInterval);
            checkStatus();
            pollInterval = setInterval(checkStatus, 3000);
        }

        async function checkStatus() {
            if (!currentUserId) return;
            try {
                const res = await fetch(`/api/whatsapp/status/${encodeURIComponent(currentUserId)}`);
                const data = await res.json();
                const qrBox = document.getElementById('qrcode');
                const qrHint = document.getElementById('qrHint');

                if (data.ready) {
                    setStatus('WhatsApp Connected ✓', true);
                    qrBox.innerHTML = '';
                    qrHint.classList.add('hidden');
                    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
                } else if (data.qr) {
                    setStatus('Scan this QR to connect WhatsApp', false);
                    qrBox.innerHTML = '';
                    new QRCode(qrBox, { text: data.qr, width: 240, height: 240 });
                    qrHint.classList.remove('hidden');
                } else {
                    setStatus('Booting WhatsApp Driver...', false);
                    qrBox.innerHTML = '';
                    qrHint.classList.add('hidden');
                }
            } catch (e) { /* keep polling silently */ }
        }

        function resetLogin() {
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
            currentUserId = null;
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('qrHint').classList.add('hidden');
            document.getElementById('statusBadge').classList.add('hidden');
            document.getElementById('activeUserLabel').classList.add('hidden');
            document.getElementById('resetRow').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('userIdInput').value = '';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const qid = getQueryUserId();
            if (qid) {
                document.getElementById('userIdInput').value = qid;
                startLogin(qid);
            }
        });
    </script>
</body>

</html>
