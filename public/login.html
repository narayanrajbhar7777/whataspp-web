<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — WhatsApp Scheduler Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #f0f7ff 100%);
            color: #0f172a;
            padding: 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: #00843d;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 14px;
            box-shadow: 0 4px 14px rgba(0,132,61,.25);
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 900;
            color: #064e3b;
        }

        .brand-header p {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .card {
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 12px 32px rgba(15,23,42,.09);
        }

        .card h2 {
            font-size: 18px;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .card .sub {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: #334155;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #94a3b8;
            pointer-events: none;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 12px 11px 38px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: #0f172a;
            background: #f8fafc;
            transition: border-color .18s, box-shadow .18s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #00843d;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,132,61,.12);
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #94a3b8;
            padding: 0;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #00843d;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 6px;
            letter-spacing: .3px;
            transition: background .18s, transform .1s;
        }

        .btn-login:hover  { background: #006b31; }
        .btn-login:active { transform: scale(.98); }

        .btn-login:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .error-msg {
            display: none;
            align-items: center;
            gap: 8px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .error-msg.show { display: flex; }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="brand-header">
            <div class="brand-icon">💬</div>
            <h1>Scheduler Pro</h1>
            <p>Enterprise WhatsApp Messaging</p>
        </div>

        <div class="card">
            <h2>Welcome back 👋</h2>
            <p class="sub">Sign in to access your dashboard</p>

            <div id="errorMsg" class="error-msg">
                <span>⚠</span>
                <span id="errorText">Invalid username or password.</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username"
                               placeholder="Enter your username"
                               autocomplete="username" required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" onclick="togglePassword()" title="Show/hide password">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>
        </div>

        <p class="footer-note">© 2026 WhatsApp Scheduler Pro · All rights reserved</p>
    </div>

    <script>
        function togglePassword() {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('errorMsg');
            const errTxt = document.getElementById('errorText');

            errBox.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Signing in...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    btn.innerHTML = '✓ Success! Redirecting...';
                    btn.style.background = '#166534';
                    window.location.href = '/';
                } else {
                    errTxt.textContent = data.error || 'Invalid username or password.';
                    errBox.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In';
                }
            } catch (err) {
                errTxt.textContent = 'Server error. Please try again.';
                errBox.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }

        // Auto-focus username field
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
